# API 调用插件（双面包：host + client）。
#
# 这一行同时是 host 行（Loader 加载包的 lib/index.js：settings 持久化 +
# /api/api-tools HTTP API + 动态注册第三方 API 的 Agent 工具）和 dsh.client 行
# （modules 的 node half 扫描 package.json 的 dsh.client 声明，把 lib/client.js
# 加入浏览器 roster，在设置页左侧渲染「API 调用」页）。
#
# inject 声明 host 半部的硬依赖：
# - settings：API 工具配置列表持久化；
# - webServer：/api/api-tools HTTP API 载体；
# - tools：把每个已启用的 API 配置注册成 Agent 可调用的工具；
# - credentials：凭据引用（API Key / Token）的解析，密钥不进配置、只存引用名。
# 四者均由 web profile 的 bundle 层提供。

- insert:
    - id: api-tools
      name: '@deepseek-ai/dsh-api-tools'
      inject: [settings, webServer, tools, credentials]
