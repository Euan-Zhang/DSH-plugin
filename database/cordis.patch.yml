# 数据库连接插件（双面包：host + client）。
#
# 这一行同时是 host 行（Loader 加载包的 lib/index.js：settings 持久化 +
# /api/database-connections HTTP API + MySQL/ClickHouse 连接）和 dsh.client 行
# （modules 的 node half 扫描 package.json 的 dsh.client 声明，把 lib/client.js
# 加入浏览器 roster，在设置页左侧渲染"数据库连接"页）。
#
# inject 声明 host 半部的硬依赖：settings（连接列表持久化）与 webServer
# （HTTP API 载体）。两者都由 web profile 的 bundle 层提供。

- insert:
    - id: database-connections
      name: '@deepseek-ai/dsh-database-connections'
      inject: [settings, webServer]
